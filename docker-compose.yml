# Local development environment. Usage: cp .env.example .env && docker compose up --build
# The web client is served on http://localhost:${WEB_PORT:-8081} (nginx, proxies /api and /hubs to the API).
# Services for later stages (Redis) are added when they are used.

name: flightlog

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3 compatible object storage for raw log files (SeaweedFS, see docs/adr/0009-object-storage-server.md).
  storage:
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    command: ["mini", "-dir=/data", "-master.telemetry=false"]
    environment:
      AWS_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY:?set STORAGE_ACCESS_KEY in .env}
      AWS_SECRET_ACCESS_KEY: ${STORAGE_SECRET_KEY:?set STORAGE_SECRET_KEY in .env}
    volumes:
      - storage-data:/data
    ports:
      - "127.0.0.1:8333:8333"
    healthcheck:
      # Anonymous requests are refused (403), which still proves the S3 endpoint is serving.
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8333/ | grep -q 403"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Work queue between API and workers (ADR-0006). Management UI on http://localhost:15672 (same credentials).
  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?set RABBITMQ_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: src/FlightLog.Api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      storage:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};GSS Encryption Mode=Disable
      Database__MigrateOnStartup: "true"
      Auth__AllowSelfRegistration: ${ALLOW_SELF_REGISTRATION:-false}
      Auth__RateLimitPerMinute: ${AUTH_RATE_LIMIT_PER_MINUTE:-10}
      Auth__BootstrapAdministrator__Email: ${ADMIN_EMAIL:-}
      Auth__BootstrapAdministrator__Password: ${ADMIN_PASSWORD:-}
      Storage__ServiceUrl: http://storage:8333
      Storage__Bucket: flightlog
      Storage__AccessKey: ${STORAGE_ACCESS_KEY}
      Storage__SecretKey: ${STORAGE_SECRET_KEY}
      Storage__CreateBucketIfMissing: "true"
      Uploads__MaxFileSizeBytes: ${UPLOAD_MAX_BYTES:-536870912}
      Messaging__Transport: RabbitMq
      RabbitMq__HostName: rabbitmq
      RabbitMq__UserName: ${RABBITMQ_USER}
      RabbitMq__Password: ${RABBITMQ_PASSWORD}
      # Logs are processed by the worker service below, not inside the API.
      Processing__Enabled: "false"
      # AI reports (ADR-0008): the API only queues them and enforces the quota; it never gets the provider key.
      Ai__Enabled: ${AI_ENABLED:-false}
      Ai__Model: ${AI_MODEL:-claude-opus-5-5}
      Ai__DailyLimitPerTeam: ${AI_DAILY_LIMIT_PER_TEAM:-20}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    healthcheck:
      # The aspnet base image has no curl; bash's /dev/tcp is enough for a plain HTTP probe.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q Healthy <&3"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # Parses queued logs into signals, events and parameters and runs the analysis rules (consumes RabbitMQ).
  # Scale with: docker compose up --scale worker=3
  worker:
    build:
      context: .
      dockerfile: src/FlightLog.Worker/Dockerfile
    restart: unless-stopped
    depends_on:
      # The API applies the migrations and creates the bucket.
      api:
        condition: service_healthy
    environment:
      DOTNET_ENVIRONMENT: Production
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};GSS Encryption Mode=Disable
      Storage__ServiceUrl: http://storage:8333
      Storage__Bucket: flightlog
      Storage__AccessKey: ${STORAGE_ACCESS_KEY}
      Storage__SecretKey: ${STORAGE_SECRET_KEY}
      Messaging__Transport: RabbitMq
      RabbitMq__HostName: rabbitmq
      RabbitMq__UserName: ${RABBITMQ_USER}
      RabbitMq__Password: ${RABBITMQ_PASSWORD}
      # The worker writes AI reports; the key stays in .env and this container only.
      Ai__Model: ${AI_MODEL:-claude-opus-5-5}
      Ai__Effort: ${AI_EFFORT:-high}
      Ai__ApiKey: ${ANTHROPIC_API_KEY:-}
      # Audit entries older than this are purged by the worker's maintenance (ADR-0012).
      Audit__RetentionDays: ${AUDIT_RETENTION_DAYS:-730}

  # React client (ADR-0010): static build behind nginx, which proxies /api and /hubs so the browser sees one origin.
  web:
    build:
      context: web
      args:
        VITE_MAP_TILE_URL: ${MAP_TILE_URL:-}
        VITE_MAP_TILE_ATTRIBUTION: ${MAP_TILE_ATTRIBUTION:-}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_UPSTREAM: http://api:8080
      MAP_TILE_ORIGIN: ${MAP_TILE_ORIGIN:-https://tile.openstreetmap.org}
    ports:
      - "127.0.0.1:${WEB_PORT:-8081}:8080"

volumes:
  postgres-data:
  storage-data:
  rabbitmq-data:
