name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build (warnings are errors)
        run: dotnet build --no-restore -c Release

      - name: Check formatting
        run: dotnet format --verify-no-changes --no-restore

      - name: Check for vulnerable packages
        run: |
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
          ! grep -q -i "has the following vulnerable packages" vulnerable.txt

      - name: Unit tests
        run: dotnet test --project tests/FlightLog.UnitTests -c Release --no-build

      - name: Parser tests (real PX4 and ArduPilot logs against pyulog/pymavlink results)
        run: dotnet test --project tests/FlightLog.ParserTests -c Release --no-build

      # Testcontainers starts PostgreSQL through the Docker daemon available on the runner.
      - name: Integration tests
        run: dotnet test --project tests/FlightLog.IntegrationTests -c Release --no-build

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: API types match the OpenAPI snapshot
        run: |
          npm run api:types
          git diff --exit-code -- src/api/schema.d.ts

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit and component tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Check for vulnerable runtime packages
        run: npm audit --omit=dev --audit-level=high

  docker:
    runs-on: ubuntu-latest
    needs: [build-and-test, web]
    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: |
          cp .env.example .env
          docker compose build

      - name: Smoke test with Docker Compose (upload a log, wait for the worker)
        run: |
          docker compose up -d --wait --wait-timeout 180
          curl --fail --silent http://127.0.0.1:8080/health/ready
          # Through the web container: exercises the nginx proxy for /api and streamed uploads.
          scripts/smoke-test.sh http://127.0.0.1:8081

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: End-to-end tests in the browser (web container, real logs)
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          curl --fail --silent http://127.0.0.1:8081/healthz
          npm run e2e

      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

      - name: Service logs
        if: always()
        run: docker compose logs --no-color api worker web | tail -n 300

      - name: Stop
        if: always()
        run: docker compose down -v
